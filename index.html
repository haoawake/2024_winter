<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Brick Rogue</title><style>*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060914;color:#fff;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.p{background:#10162dcc;border:1px solid #ffffff18;border-radius:14px;padding:7px 10px;backdrop-filter:blur(8px);font-size:12px}.p b{display:block;font-size:17px}.skills{position:fixed;left:12px;top:67px;display:flex;gap:6px;flex-wrap:wrap;max-width:90vw;pointer-events:none}.chip{background:#ffffff13;border:1px solid #ffffff12;border-radius:999px;padding:5px 7px;font-size:11px}.tip{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#0007;border-radius:999px;padding:6px 10px;font-size:12px;white-space:nowrap;pointer-events:none}.ov{display:none;position:fixed;inset:0;background:#050711d9;backdrop-filter:blur(9px);align-items:center;justify-content:center;padding:18px;z-index:8}.ov.on{display:flex}.box{width:min(900px,96vw);background:linear-gradient(160deg,#192044,#090d20);border:1px solid #ffffff18;border-radius:24px;padding:20px;max-height:92vh;overflow:auto}.title{font-size:clamp(36px,7vw,68px);font-weight:950;letter-spacing:-.05em;background:linear-gradient(90deg,#75bdff,#c178ff);background-clip:text;color:transparent}.sub{opacity:.7;margin:7px 0 18px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.card{background:#ffffff0e;border:1px solid #ffffff1c;border-radius:18px;padding:16px;min-height:160px;display:flex;flex-direction:column;justify-content:space-between}.card:active{transform:scale(.98);background:#ffffff18}.card h3{margin:7px 0;font-size:20px}.card small{opacity:.64}.desc{font-size:13px;line-height:1.45;opacity:.82}button{border:0;border-radius:14px;padding:12px 18px;background:linear-gradient(135deg,#5678ff,#965cff);color:#fff;font-size:15px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.st{padding:12px;background:#ffffff0c;border-radius:14px}.st small{display:block;opacity:.6}@media(max-width:740px){.cards{grid-template-columns:1fr}.card{min-height:120px}.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="p">关卡<b id="lv">1</b></div><div class="p">得分<b id="sc">0</b></div><div class="p">生命<b id="hp">❤❤❤</b></div><div class="p">金币<b id="gd">0</b></div></div><div id="sk" class="skills"></div><div class="tip">拖动挡板 · 点击发球</div><div id="ov" class="ov on"></div><script>(()=>{const c=document.querySelector('#c'),x=c.getContext('2d'),ov=document.querySelector('#ov'),$=id=>document.querySelector(id);let W,H,D,last=performance.now(),run=0,pause=0,stage=1,score=0,gold=0,lives=3,combo=0,best=0,pad,balls=[],bricks=[],parts=[],shots=[],coins=[],drag=0,shake=0,shield=0,laserCD=0,droneX=90,droneD=1;const L={};const S={multi:['分裂核心','每关初始球 +1；获得时立刻增加多球。',5,'稀有'],pierce:['穿透弹道','每级 +18% 概率穿透砖块。',5,'史诗'],crit:['暴击几何','每级 +12% 概率造成双倍伤害。',5,'稀有'],wide:['超宽挡板','挡板宽度 +18%。',4,'普通'],speed:['超频反弹','球速 +10%，得分倍率提高。',5,'普通'],shield:['一次性护盾','每关第一次漏球不会损失生命。',3,'稀有'],laser:['脉冲炮台','挡板自动发射激光，升级提高射速。',5,'史诗'],magnet:['磁吸挡板','碰到挡板后黏住，点击重新发射。',1,'稀有'],combo:['连击增幅','高连击会额外增加球的伤害。',3,'史诗'],greed:['贪婪算法','提高金币掉率和过关奖励。',5,'普通'],regen:['生命合成','每完成 3 关恢复 1 条生命。',1,'传奇'],drone:['镜像无人机','底部生成移动无人机，帮你救球。',1,'传奇']};const R=(a,b)=>a+Math.random()*(b-a),C=(v,a,b)=>Math.max(a,Math.min(b,v));function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);if(pad){pad.y=H-70;pad.x=C(pad.x,5,W-pad.w-5)}}addEventListener('resize',resize);resize();function pw(){return Math.min(W*.37,Math.max(96,125*Math.pow(1.18,L.wide||0)))}function mkpad(){pad={x:W/2-pw()/2,y:H-70,w:pw(),h:15,vx:0}}function ball(st=1,a=-Math.PI/2,off=0){let sp=390*Math.pow(1.1,L.speed||0);balls.push({x:pad.x+pad.w/2+off,y:pad.y-10,r:7,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,st,off,tr:[]})}function level(first=0){mkpad();balls=[];parts=[];shots=[];coins=[];combo=0;shield=0;laserCD=0;mkbricks();let n=1+(L.multi||0);for(let i=0;i<n;i++)ball(1,-Math.PI/2+(i-(n-1)/2)*.15,(i-(n-1)/2)*14);run=1;pause=0;if(!first)hud()}function mkbricks(){bricks=[];let cols=C(8+Math.floor(stage/2),8,13),rows=C(5+Math.floor(stage/3),5,9),m=Math.max(14,W*.035),g=6,top=120,bw=(W-2*m-g*(cols-1))/cols,bh=C(H*.045,23,36);for(let r=0;r<rows;r++)for(let q=0;q<cols;q++){if(Math.random()<Math.min(.11,stage*.007))continue;let hp=1;if(stage>2&&Math.random()<.27)hp++;if(stage>5&&Math.random()<.15)hp++;if(stage>9&&Math.random()<.08)hp++;bricks.push({x:m+q*(bw+g),y:top+r*(bh+g),w:bw,h:bh,hp,max:hp,h:(210+r*17+q*4+stage*9)%360,on:1})}}function hud(){$('#lv').textContent=stage;$('#sc').textContent=Math.floor(score);$('#gd').textContent=gold;$('#hp').textContent='❤'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,5-lives));$('#sk').innerHTML=Object.entries(L).filter(v=>v[1]>0).map(([k,v])=>`<span class=chip>${S[k][0]}${v>1?' Lv.'+v:''}</span>`).join('')}function burst(px,py,h,n=8){for(let i=0;i<n;i++)parts.push({x:px,y:py,vx:R(-150,150),vy:R(-180,50),t:R(.25,.55),h,s:R(2,4)})}function hit(b,d=1,ba){let cr=Math.random()<(L.crit||0)*.12;if(cr)d*=2;if(L.combo)d+=Math.min(L.combo,Math.floor(combo/8));b.hp-=d;combo++;best=Math.max(best,combo);score+=(10+combo*.7)*(1+(L.speed||0)*.08)*(cr?1.3:1);burst(ba?.x||b.x+b.w/2,ba?.y||b.y+b.h/2,b.h,cr?14:7);shake=Math.min(7,shake+1.2);if(b.hp<=0){b.on=0;score+=20*b.max;if(Math.random()<.08+(L.greed||0)*.035)coins.push({x:b.x+b.w/2,y:b.y+b.h/2,vy:110})}}function release(){balls.forEach(b=>{if(b.st){let sp=390*Math.pow(1.1,L.speed||0),r=(b.x-(pad.x+pad.w/2))/(pad.w/2);b.vx=C(r,-1,1)*sp*.75;b.vy=-Math.sqrt(Math.max(sp*sp-b.vx*b.vx,sp*sp*.35));b.st=0}})}function move(px){let old=pad.x;pad.x=C(px-pad.w/2,5,W-pad.w-5);pad.vx=(pad.x-old)*60;balls.forEach(b=>{if(b.st)b.x=pad.x+pad.w/2+b.off})}c.onpointerdown=e=>{drag=1;move(e.clientX);release()};c.onpointermove=e=>drag&&move(e.clientX);c.onpointerup=c.onpointercancel=()=>drag=0;function choose(){pause=1;run=0;let pool=Object.keys(S).filter(k=>(L[k]||0)<S[k][2]),out=[];while(out.length<Math.min(3,pool.length)){let k=pool[Math.floor(Math.random()*pool.length)];if(!out.includes(k))out.push(k)}ov.innerHTML=`<div class=box><h2>关卡 ${stage} 清除</h2><div class=sub>三选一，继续构筑。</div><div class=cards>${out.map(k=>`<div class=card data-k=${k}><div><small>${S[k][3]}</small><h3>${S[k][0]}</h3><div class=desc>${S[k][1]}</div></div><small>${L[k]?`Lv.${L[k]} → Lv.${L[k]+1}`:'新技能'}</small></div>`).join('')}</div></div>`;ov.classList.add('on');ov.querySelectorAll('.card').forEach(el=>el.onclick=()=>{let k=el.dataset.k;L[k]=(L[k]||0)+1;if(k==='wide'){let m=pad.x+pad.w/2;pad.w=pw();pad.x=C(m-pad.w/2,5,W-pad.w-5)}stage++;if(L.regen&&stage%3===1)lives=Math.min(5,lives+1);ov.classList.remove('on');level();hud()})}function over(){run=0;pause=1;ov.innerHTML=`<div class=box><div class=title>GAME OVER</div><div class=stats><div class=st><small>关卡</small><b>${stage}</b></div><div class=st><small>得分</small><b>${Math.floor(score)}</b></div><div class=st><small>最高连击</small><b>${best}</b></div><div class=st><small>金币</small><b>${gold}</b></div></div><button id=again>再来一局</button></div>`;ov.classList.add('on');$('#again').onclick=start}function start(){stage=1;score=gold=combo=best=0;lives=3;for(let k in L)delete L[k];ov.classList.remove('on');level(1);hud()}function upd(dt){if(!run||pause)return;if(shake)shake=Math.max(0,shake-dt*20);if(L.drone){droneX+=droneD*170*dt;if(droneX<70)droneD=1;if(droneX>W-70)droneD=-1}if(L.laser){laserCD-=dt;if(laserCD<=0){laserCD=Math.max(.22,.9-(L.laser-1)*.13);shots.push({x:pad.x+pad.w*.27,y:pad.y},{x:pad.x+pad.w*.73,y:pad.y})}}for(let i=shots.length-1;i>=0;i--){let s=shots[i];s.y-=620*dt;let dead=0;for(let b of bricks)if(b.on&&s.x>b.x&&s.x<b.x+b.w&&s.y>b.y&&s.y<b.y+b.h){hit(b,1);dead=1;break}if(dead||s.y<0)shots.splice(i,1)}for(let i=coins.length-1;i>=0;i--){let q=coins[i];q.y+=q.vy*dt;if(q.y>pad.y&&q.x>pad.x&&q.x<pad.x+pad.w){gold++;score+=25;coins.splice(i,1);hud()}else if(q.y>H)coins.splice(i,1)}for(let i=balls.length-1;i>=0;i--){let b=balls[i];if(b.st){b.x=pad.x+pad.w/2+b.off;b.y=pad.y-b.r-1;continue}let sp=Math.hypot(b.vx,b.vy),steps=Math.max(1,Math.ceil(sp*dt/9)),sd=dt/steps,gone=0;for(let z=0;z<steps;z++){b.x+=b.vx*sd;b.y+=b.vy*sd;b.tr.push([b.x,b.y]);if(b.tr.length>8)b.tr.shift();if(b.x-b.r<0){b.x=b.r;b.vx=Math.abs(b.vx)}if(b.x+b.r>W){b.x=W-b.r;b.vx=-Math.abs(b.vx)}if(b.y-b.r<55){b.y=55+b.r;b.vy=Math.abs(b.vy)}if(b.vy>0&&b.y+b.r>pad.y&&b.y-b.r<pad.y+pad.h&&b.x>pad.x-b.r&&b.x<pad.x+pad.w+b.r){b.y=pad.y-b.r;let r=(b.x-(pad.x+pad.w/2))/(pad.w/2);b.vx=C(r,-1,1)*sp*.9+pad.vx*.1;b.vy=-Math.sqrt(Math.max(sp*sp-b.vx*b.vx,sp*sp*.3));if(L.magnet){b.st=1;b.off=b.x-(pad.x+pad.w/2)}combo=0}for(let br of bricks)if(br.on&&b.x+b.r>br.x&&b.x-b.r<br.x+br.w&&b.y+b.r>br.y&&b.y-b.r<br.y+br.h){hit(br,1,b);if(Math.random()> (L.pierce||0)*.18)b.vy*=-1;break}if(b.y-b.r>H){if(L.drone&&Math.abs(b.x-droneX)<65){b.y=H-115;b.vy=-Math.abs(b.vy)}else if(L.shield&&!shield){shield=1;b.y=H-105;b.vy=-Math.abs(b.vy)}else{balls.splice(i,1);combo=0;gone=1}break}}}if(!balls.length){lives--;hud();if(lives<=0)return over();ball(1)}if(bricks.every(b=>!b.on)){gold+=5+(L.greed||0)*2;hud();run=0;setTimeout(choose,220)}}function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}function draw(){x.save();x.translate(shake?R(-shake,shake):0,shake?R(-shake,shake):0);x.clearRect(-20,-20,W+40,H+40);let g=x.createRadialGradient(W/2,80,20,W/2,80,H);g.addColorStop(0,'#17234c');g.addColorStop(1,'#060914');x.fillStyle=g;x.fillRect(0,0,W,H);for(let b of bricks)if(b.on){let gr=x.createLinearGradient(b.x,b.y,b.x,b.y+b.h);gr.addColorStop(0,`hsl(${b.h} 90% 70%)`);gr.addColorStop(1,`hsl(${b.h} 80% 43%)`);x.fillStyle=gr;rr(b.x,b.y,b.w,b.h,7);x.fill();if(b.max>1){x.fillStyle='#0006';x.fillRect(b.x+4,b.y+b.h-4,b.w-8,2);x.fillStyle='#fff';x.fillRect(b.x+4,b.y+b.h-4,(b.w-8)*b.hp/b.max,2)}}if(L.drone){x.fillStyle='#7dd6ff44';rr(droneX-60,H-120,120,10,5);x.fill()}x.shadowBlur=20;x.shadowColor='#8e8cff';let pg=x.createLinearGradient(pad.x,0,pad.x+pad.w,0);pg.addColorStop(0,'#5ed7ff');pg.addColorStop(.5,'#8a72ff');pg.addColorStop(1,'#dd67ff');x.fillStyle=pg;rr(pad.x,pad.y,pad.w,pad.h,8);x.fill();x.shadowBlur=0;x.strokeStyle='#aefcff';x.lineWidth=3;shots.forEach(s=>{x.beginPath();x.moveTo(s.x,s.y);x.lineTo(s.x,s.y+15);x.stroke()});coins.forEach(q=>{x.fillStyle='#ffd65c';x.beginPath();x.arc(q.x,q.y,7,0,7);x.fill()});for(let b of balls){b.tr.forEach((p,i)=>{x.globalAlpha=(i+1)/b.tr.length*.18;x.fillStyle='#b9d5ff';x.beginPath();x.arc(p[0],p[1],5,0,7);x.fill()});x.globalAlpha=1;x.shadowBlur=15;x.shadowColor='#b9d5ff';x.fillStyle='#fff';x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();x.shadowBlur=0}for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.t-=1/60;p.x+=p.vx/60;p.y+=p.vy/60;p.vy+=280/60;if(p.t<=0){parts.splice(i,1);continue}x.globalAlpha=Math.min(1,p.t*3);x.fillStyle=`hsl(${p.h} 90% 70%)`;x.fillRect(p.x,p.y,p.s,p.s)}x.globalAlpha=1;if(combo>4){x.textAlign='center';x.font='900 18px system-ui';x.fillStyle='#ffffffbb';x.fillText('COMBO x'+combo,W/2,98)}x.restore()}function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;upd(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);ov.innerHTML=`<div class=box><div class=title>BRICK ROGUE</div><div class=sub>肉鸽打砖块 · 平板触控版</div><div class=stats><div class=st><b>拖动</b><small>控制挡板</small></div><div class=st><b>点击</b><small>发球</small></div><div class=st><b>清场</b><small>技能三选一</small></div><div class=st><b>叠加</b><small>构筑流派</small></div></div><button id=go>开始游戏</button></div>`;$('#go').onclick=start;draw()})()</script></body></html>
