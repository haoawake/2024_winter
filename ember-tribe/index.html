<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>余火：部落进化</title><style>:root{--b:#0d0f12;--p:#15191e;--p2:#1b2026;--l:#2a3038;--t:#e8e4da;--m:#9ea5ad;--a:#d1b06b;--g:#a9d59b;--w:#e0b46a;--r:#d68181}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}html,body{margin:0;min-height:100%;background:var(--b);color:var(--t);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC",monospace;overscroll-behavior:none}body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}button{font:inherit}.app{width:min(1160px,100%);margin:auto;padding:12px}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--l);padding:8px 2px 12px}.head h1{font-size:23px;margin:0}.muted{color:var(--m);font-size:12px}.era{color:var(--a);font-size:13px}.layout{display:grid;grid-template-columns:315px 1fr;gap:12px;margin-top:12px}.panel{background:var(--p);border:1px solid var(--l);border-radius:8px;padding:12px}.panel h2{font-size:15px;color:var(--a);margin:0 0 9px}.res{display:grid;grid-template-columns:1fr auto;gap:5px;border-bottom:1px dashed #252b32;padding:6px 0;font-size:14px}.rate{font-size:11px;color:var(--g);margin-left:5px}.neg{color:var(--r)}.big{width:100%;padding:12px;margin:5px 0;border:1px solid #5b4d34;background:#211c14;color:#ead7ad;border-radius:6px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tab,.btn{border:1px solid #45505b;background:#232a32;color:var(--t);padding:8px 10px;border-radius:6px}.tab.active{color:#fff;background:#303844}.tabview{display:none}.tabview.on{display:block}.job{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;padding:8px 0;border-bottom:1px dashed #252b32}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{background:var(--p2);border:1px solid var(--l);border-radius:7px;padding:10px}.card h3{margin:0 0 6px;font-size:14px}.desc{font-size:12px;color:var(--m);line-height:1.5}.cost{font-size:11px;color:var(--w);margin:7px 0}.log{height:210px;overflow:auto;background:#0b0d10;border:1px solid #232830;border-radius:6px;padding:8px;font-size:12px;line-height:1.6}.good{color:var(--g)}.bad{color:var(--r)}.event{color:var(--a)}.progress{height:8px;background:#0d1014;border:1px solid #2b3138;border-radius:99px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:#85714c}.tag{font-size:11px;color:var(--m)}button:disabled{opacity:.35}.hidden{display:none!important}@media(max-width:820px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.panel{padding:10px}.log{height:170px}}</style></head><body><div class="app"><div class="head"><div><h1>余火：部落进化</h1><div class="muted">纯文字放置增量游戏</div></div><div style="text-align:right"><div id="era" class="era">荒野营地</div><div id="day" class="muted">第 1 日</div></div></div><div class="layout"><aside><section class="panel"><h2>部落概况</h2><div class="res"><span>人口</span><span><b id="pop">3</b> / <span id="cap">5</span></span></div><div class="res"><span>空闲人口</span><span id="idle">3</span></div><div class="res"><span>幸福度</span><span><span id="happy">70</span>%</span></div><div class="res"><span>威望</span><span id="prestige">0</span></div></section><section class="panel" style="margin-top:12px"><h2>资源</h2><div id="resources"></div></section><section class="panel" style="margin-top:12px"><h2>立即行动</h2><button class="big" onclick="manual('food')">搜寻食物 +3</button><button class="big" onclick="manual('wood')">拾取木材 +2</button><div class="muted">食物充足、幸福度正常且还有住房时，前期约 20–40 秒增长 1 人。人口到上限后请建草屋。</div></section><section class="panel" style="margin-top:12px"><h2>时代进度</h2><div id="goal" class="muted"></div><div class="progress"><i id="bar" style="width:0%"></i></div></section></aside><main><section class="panel"><div class="tabs"><button class="tab active" data-t="jobs">人口</button><button class="tab" data-t="build">建造</button><button class="tab" data-t="tech">研究</button><button class="tab" data-t="legacy">传承</button></div><div id="jobs" class="tabview on"></div><div id="build" class="tabview"></div><div id="tech" class="tabview"></div><div id="legacy" class="tabview"></div></section><section class="panel" style="margin-top:12px"><h2>部落日志</h2><div id="log" class="log"></div></section></main></div></div><script>const $=s=>document.querySelector(s),fmt=n=>Math.abs(n)<1000?(Math.round(n*10)/10):n<1e6?(n/1e3).toFixed(1)+'K':(n/1e6).toFixed(1)+'M',clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const RES={food:'食物',wood:'木材',stone:'石料',knowledge:'知识',tools:'工具',metal:'金属'},ERAS=['荒野营地','定居部落','河谷村落','繁盛聚落','青铜城邦'];const JOBS={gatherer:{n:'采集者',d:'采集野果和小型猎物。',food:1.2},woodcutter:{n:'伐木者',d:'收集木材。',wood:.65},hunter:{n:'猎人',d:'高效获得食物。',food:2.2,need:'hunting'},miner:{n:'采石者',d:'开采石料。',stone:.5,need:'stoneTools'},thinker:{n:'思考者',d:'产生知识。',knowledge:.32,need:'language'},farmer:{n:'农夫',d:'稳定耕作。',food:3.1,need:'farming'},artisan:{n:'工匠',d:'制造工具。',tools:.18,bld:'workshop'},smelter:{n:'冶炼者',d:'炼出金属。',metal:.12,need:'bronze'},scholar:{n:'学者',d:'系统产生知识。',knowledge:.85,bld:'school'}};const B={firepit:{n:'营火',d:'食物消耗 -8%。',c:{wood:10},max:1},hut:{n:'草屋',d:'人口上限 +3。',c:{wood:16,food:6}},storage:{n:'粮仓',d:'抵御储粮损失。',c:{wood:30,stone:8},era:1,max:10},quarry:{n:'采石营地',d:'采石效率 +25%。',c:{wood:28,stone:18},era:1,max:5},workshop:{n:'工坊',d:'解锁工匠。',c:{wood:45,stone:20,knowledge:12},era:1,max:8},farm:{n:'农田',d:'农夫效率提升。',c:{wood:35,stone:15,food:40},era:2,max:20,need:'farming'},well:{n:'水井',d:'幸福度与生产提高。',c:{stone:60,wood:20},era:2,max:5},hall:{n:'议事厅',d:'人口上限 +15，知识提高。',c:{wood:140,stone:100,knowledge:100},era:2,max:1},school:{n:'学舍',d:'解锁学者。',c:{wood:120,stone:80,tools:15,knowledge:160},era:3,max:10},palisade:{n:'木墙',d:'减轻灾害损失。',c:{wood:180,stone:70,tools:8},era:3,max:5},foundry:{n:'铸造坊',d:'提高冶炼效率。',c:{wood:240,stone:220,tools:30,metal:12},era:4,max:10,need:'bronze'}};const T={fire:{n:'保存火种',d:'学会保存火种。',c:{knowledge:5}},language:{n:'语言',d:'解锁思考者。',c:{knowledge:14}},hunting:{n:'协作狩猎',d:'解锁猎人。',c:{knowledge:20,wood:8}},stoneTools:{n:'打制石器',d:'解锁采石者。',c:{knowledge:35,stone:5},era:1},kinship:{n:'氏族制度',d:'人口增长 +20%。',c:{knowledge:45,food:30},era:1},farming:{n:'原始农耕',d:'解锁农夫和农田。',c:{knowledge:90,food:80,tools:4},era:2},counting:{n:'计数与结绳',d:'所有生产 +10%。',c:{knowledge:120},era:2},medicine:{n:'草药医学',d:'降低灾害死亡。',c:{knowledge:150,food:90},era:2},writing:{n:'刻符文字',d:'知识产出 +35%。',c:{knowledge:300,tools:12},era:3},bronze:{n:'青铜冶炼',d:'解锁金属。',c:{knowledge:520,stone:180,tools:30},era:3},law:{n:'成文法',d:'幸福度更加稳定。',c:{knowledge:900,metal:30},era:4},trade:{n:'远途贸易',d:'所有生产 +20%。',c:{knowledge:1200,metal:50,tools:80},era:4}};function base(){return{resources:{food:30,wood:8,stone:0,knowledge:0,tools:0,metal:0},population:3,popProgress:0,happiness:70,prestige:0,era:0,day:1,seconds:0,jobs:{},buildings:{},tech:{},legacy:+localStorage.getItem('ember_legacy')||0,totalKnowledge:0,highestPopulation:3,lastSave:Date.now(),eventTimer:70}}function load(){try{let d=JSON.parse(localStorage.getItem('ember_tribe_save'));if(!d)return base();let b=base();return{...b,...d,resources:{...b.resources,...d.resources},jobs:d.jobs||{},buildings:d.buildings||{},tech:d.tech||{},legacy:+localStorage.getItem('ember_legacy')||d.legacy||0}}catch{return base()}}let G=load();function assigned(){return Object.values(G.jobs).reduce((a,b)=>a+b,0)}function idle(){return Math.max(0,Math.floor(G.population)-assigned())}function cap(){return 5+(G.buildings.hut||0)*3+(G.buildings.hall||0)*15+G.era*2}function pm(){let m=1+G.legacy*.05+Math.min(G.resources.tools,100)*.006;if(G.tech.counting)m*=1.1;if(G.tech.trade)m*=1.2;if(G.buildings.well)m*=1+(G.buildings.well*.05);return m}function rates(){let r={food:0,wood:0,stone:0,knowledge:0,tools:0,metal:0};for(const[id,n]of Object.entries(G.jobs)){let j=JOBS[id];if(!j||!n)continue;for(let k of Object.keys(r))if(j[k])r[k]+=j[k]*n}if(G.jobs.miner)r.stone*=1+(G.buildings.quarry||0)*.25;if(G.jobs.farmer)r.food+=G.jobs.farmer*3.1*(G.buildings.farm||0)*.22;if(G.buildings.school)r.knowledge*=1+(G.buildings.school*.15);if(G.buildings.hall)r.knowledge*=1.25;if(G.tech.writing)r.knowledge*=1.35;if(G.tech.stoneTools)r.wood*=1.15;if(G.buildings.foundry)r.metal*=1+(G.buildings.foundry*.3);let m=pm();Object.keys(r).forEach(k=>r[k]*=m);let use=G.population*.34;if(G.buildings.firepit)use*=.92;r.food-=use;return r}function afford(c){return Object.entries(c).every(([k,v])=>(G.resources[k]||0)>=v)}function pay(c){Object.entries(c).forEach(([k,v])=>G.resources[k]-=v)}function scost(c,n){let o={};Object.entries(c).forEach(([k,v])=>o[k]=Math.ceil(v*Math.pow(1.18,n)));return o}function cost(c){return Object.entries(c).map(([k,v])=>RES[k]+' '+fmt(v)).join(' / ')}function log(t,cl=''){let d=document.createElement('div');d.className=cl;d.textContent='[第 '+Math.floor(G.day)+' 日] '+t;$('#log').appendChild(d);$('#log').scrollTop=99999}function manual(k){let n=(k==='food'?3:2)*(1+G.legacy*.05);G.resources[k]+=n;render()}window.manual=manual;function assign(id,d){if(d>0&&idle()<=0)return;G.jobs[id]=Math.max(0,(G.jobs[id]||0)+d);render()}window.assign=assign;function unlockedJob(j){return(!j.need||G.tech[j.need])&&(!j.bld||(G.buildings[j.bld]||0)>0)}function build(id){let b=B[id],n=G.buildings[id]||0,c=scost(b.c,n);if(!afford(c))return;pay(c);G.buildings[id]=n+1;log('建成「'+b.n+'」。','good');checkEra();render()}window.build=build;function research(id){let t=T[id];if(G.tech[id]||!afford(t.c))return;pay(t.c);G.tech[id]=1;log('掌握「'+t.n+'」。','event');checkEra();render()}window.research=research;function progress(){if(G.era===0)return clamp(G.population/8,0,1)*.35+clamp((G.buildings.hut||0)/2,0,1)*.25+(G.tech.fire?.4:0);if(G.era===1)return clamp(G.population/18,0,1)*.3+(G.tech.stoneTools?.35:0)+((G.buildings.workshop||0)>0?.35:0);if(G.era===2)return clamp(G.population/45,0,1)*.3+(G.tech.farming?.3:0)+((G.buildings.hall||0)>0?.4:0);if(G.era===3)return clamp(G.population/90,0,1)*.3+(G.tech.writing?.3:0)+(G.tech.bronze?.4:0);return 1}function goal(){return['达到 8 人、2 间草屋，并掌握火种。','达到 18 人、掌握打制石器并建造工坊。','达到 45 人、掌握农耕并建造议事厅。','达到 90 人、掌握刻符文字与青铜冶炼。','城邦已经建立，可以继续扩张或进行传承。'][G.era]}function checkEra(){if(G.era<4&&progress()>=.999){G.era++;G.prestige+=G.era*5;log('时代更替：进入「'+ERAS[G.era]+'」。','event')}}function popgrow(dt){if(G.population>=cap())return;let f=G.resources.food/Math.max(1,G.population);if(f<4||G.happiness<40)return;let s=.03*(1+(G.buildings.farm||0)*.05);if(G.tech.kinship)s*=1.2;s*=.7+G.happiness/100;G.popProgress+=s*dt;if(G.popProgress>=1){let a=Math.floor(G.popProgress);G.popProgress-=a;G.population=Math.min(cap(),G.population+a);G.highestPopulation=Math.max(G.highestPopulation,G.population);log(a+' 名新成员加入部落。','good')}}function happ(dt){let f=G.resources.food/Math.max(1,G.population),target=65;if(f>15)target+=10;if(f<3)target-=25;target+=(G.buildings.well||0)*5;if(G.tech.law)target+=5;target=clamp(target,15,G.tech.kinship?100:90);G.happiness+=(target-G.happiness)*.015*dt}function event(){let q=Math.random();if(q<.3){let n=Math.ceil(8+G.population*.8);G.resources.food+=n;log('发现迁徙兽群，食物 +'+n+'。','good')}else if(q<.55){let n=Math.ceil(5+G.era*6);G.resources.wood+=n;log('暴风刮倒枯木，木材 +'+n+'。','good')}else if(q<.75){let n=Math.ceil(5+G.population*.3);G.resources.knowledge+=n;log('夜谈留下新经验，知识 +'+n+'。','event')}else{let loss=Math.ceil(G.resources.food*.06);G.resources.food=Math.max(0,G.resources.food-loss);log('部分储粮腐坏，损失 '+loss+' 食物。','bad')}}function tick(dt){let r=rates();for(let k in r){G.resources[k]=Math.max(0,G.resources[k]+r[k]*dt);if(k==='knowledge'&&r[k]>0)G.totalKnowledge+=r[k]*dt}G.seconds+=dt;G.day=1+G.seconds/24;popgrow(dt);happ(dt);G.eventTimer-=dt;if(G.eventTimer<=0){event();G.eventTimer=65+Math.random()*50}checkEra()}function render(){let r=rates();$('#pop').textContent=fmt(G.population);$('#cap').textContent=fmt(cap());$('#idle').textContent=idle();$('#happy').textContent=Math.round(G.happiness);$('#prestige').textContent=fmt(G.prestige);$('#era').textContent=ERAS[G.era];$('#day').textContent='第 '+Math.floor(G.day)+' 日';$('#goal').textContent=goal();$('#bar').style.width=(progress()*100)+'%';$('#resources').innerHTML=Object.keys(RES).filter(k=>k!=='metal'||G.tech.bronze||G.resources.metal>0).map(k=>`<div class=res><span>${RES[k]}</span><span><b>${fmt(G.resources[k])}</b><span class="rate ${r[k]<0?'neg':''}">${r[k]>=0?'+':''}${fmt(r[k])}/秒</span></span></div>`).join('');$('#jobs').innerHTML='<h2>人口分工</h2>'+Object.entries(JOBS).filter(([,j])=>unlockedJob(j)).map(([id,j])=>`<div class=job><div><b>${j.n}</b><div class=muted>${j.d}</div></div><span>${G.jobs[id]||0}</span><button class=btn onclick="assign('${id}',-1)" ${(G.jobs[id]||0)<=0?'disabled':''}>−</button><button class=btn onclick="assign('${id}',1)" ${idle()<=0?'disabled':''}>＋</button></div>`).join('');$('#build').innerHTML='<h2>建造</h2><div class=grid>'+Object.entries(B).filter(([,b])=>(b.era||0)<=G.era&&(!b.need||G.tech[b.need])).map(([id,b])=>{let n=G.buildings[id]||0,c=scost(b.c,n),max=b.max||999;return`<div class=card><h3>${b.n} ×${n}</h3><div class=desc>${b.d}</div><div class=cost>${cost(c)}</div><button class=btn onclick="build('${id}')" ${!afford(c)||n>=max?'disabled':''}>建造</button></div>`}).join('')+'</div>';$('#tech').innerHTML='<h2>研究</h2><div class=grid>'+Object.entries(T).filter(([id,t])=>!G.tech[id]&&(t.era||0)<=G.era).map(([id,t])=>`<div class=card><h3>${t.n}</h3><div class=desc>${t.d}</div><div class=cost>${cost(t.c)}</div><button class=btn onclick="research('${id}')" ${!afford(t.c)?'disabled':''}>研究</button></div>`).join('')+'</div>';$('#legacy').innerHTML=`<h2>传承</h2><div class=desc>达到青铜城邦后，可以让文明成为传说并重新开始。每个祖灵印记永久 +5% 生产效率。</div><div class=res><span>祖灵印记</span><span>${G.legacy}</span></div><button class=big onclick="prestigeRun()" ${G.era<4?'disabled':''}>让旧文明成为传说</button>`}function prestigeRun(){if(G.era<4)return;let gain=Math.max(1,Math.floor(Math.sqrt(G.highestPopulation/25)+Math.sqrt((G.totalKnowledge||0)/500)+Object.values(G.buildings).reduce((a,b)=>a+b,0)/18));if(!confirm('获得 '+gain+' 个祖灵印记并重新开始？'))return;localStorage.setItem('ember_legacy',G.legacy+gain);G=base();G.legacy=+localStorage.getItem('ember_legacy');save();$('#log').innerHTML='';log('新的文明火种被点燃。','event');render()}window.prestigeRun=prestigeRun;function save(){G.lastSave=Date.now();localStorage.setItem('ember_tribe_save',JSON.stringify(G))}function offline(){let sec=Math.min((Date.now()-(G.lastSave||Date.now()))/1000,G.tech.counting?28800:14400);if(sec<8)return;let r=rates();for(let k in r)G.resources[k]=Math.max(0,G.resources[k]+r[k]*sec*.65);G.seconds+=sec*.65;G.day=1+G.seconds/24;log('离线期间部落继续运转，结算约 '+Math.round(sec*.65)+' 秒收益。','event')}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tabview').forEach(x=>x.classList.remove('on'));b.classList.add('active');$('#'+b.dataset.t).classList.add('on')});$('#log').innerHTML='';log('三个人围在余火旁。文明从这里开始。','event');offline();render();let last=performance.now(),rt=0,st=0;function loop(now){let dt=Math.min(.5,(now-last)/1000);last=now;tick(dt);rt+=dt;st+=dt;if(rt>.5){render();rt=0}if(st>10){save();st=0}requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));let lt=0;document.addEventListener('touchend',e=>{let n=Date.now();if(n-lt<320)e.preventDefault();lt=n},{passive:false});</script></body></html>
