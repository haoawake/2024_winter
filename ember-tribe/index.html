<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0d0f12" />
<title>余火：文明长河</title>
<link rel="stylesheet" href="v4-style.css" />
</head>
<body>
<div id="app">
  <header class="titlebar">
    <div><h1>余火：文明长河</h1><div class="smalltext">从三个人到星际文明的放置增量游戏</div></div>
    <div class="right"><div id="eraName" class="era">荒野营地</div><div id="dayTag" class="tag">第 1 日</div></div>
  </header>
  <div class="layout">
    <aside>
      <section class="panel">
        <h2>文明概况</h2>
        <div class="res"><span>人口</span><span><b id="population">3</b> / <span id="popCap">5</span></span></div>
        <div class="res"><span>空闲人口</span><span id="idle">1</span></div>
        <div class="res"><span>幸福度</span><span><span id="happiness">70</span>%</span></div>
        <div class="res"><span>领土</span><span id="territory">1</span></div>
        <div class="res"><span>威望</span><span id="prestige">0</span></div>
        <div class="subhead">人口增长</div>
        <div id="popGrowthText" class="smalltext">增长中 0%</div>
        <div class="progress"><i id="popGrowthBar"></i></div>
      </section>
      <section class="panel space"><h2>资源</h2><div id="resources"></div></section>
      <section class="panel space">
        <h2>立即行动</h2>
        <button class="bigbtn" onclick="manualGather('food')">搜寻食物</button>
        <button class="bigbtn" onclick="manualGather('wood')">拾取木材</button>
        <button class="bigbtn" onclick="exploreTerritory()">探索新领地</button>
        <div id="exploreCost" class="smalltext"></div>
      </section>
      <section class="panel space">
        <h2>时代突破</h2>
        <div id="eraGoal" class="smalltext"></div>
        <div class="progress"><i id="eraBar"></i></div>
        <button id="advanceEraBtn" class="bigbtn" onclick="advanceEra()">进入下一时代</button>
      </section>
      <section class="panel space">
        <h2>存档</h2>
        <button class="dangerbtn" onclick="restartRun()">重开本局</button>
        <div class="smalltext">重开会清空本局人口、资源、科技、分支与建筑；祖灵印记保留。</div>
      </section>
    </aside>
    <main>
      <section class="panel">
        <div class="tabs">
          <button class="tab active" data-tab="jobs">职业</button>
          <button class="tab" data-tab="buildings">建造</button>
          <button class="tab" data-tab="tech">研究</button>
          <button class="tab" data-tab="branches">发展分支</button>
          <button class="tab" data-tab="timeline">文明纪事</button>
          <button class="tab" data-tab="legacy">传承</button>
        </div>
        <div id="tab-jobs"></div>
        <div id="tab-buildings" class="hidden"></div>
        <div id="tab-tech" class="hidden"></div>
        <div id="tab-branches" class="hidden"></div>
        <div id="tab-timeline" class="hidden"></div>
        <div id="tab-legacy" class="hidden"></div>
      </section>
      <section class="panel space"><h2>文明日志</h2><div id="log" class="log"></div></section>
    </main>
  </div>
</div>
<div id="toast"></div>
<script src="v4-data.js"></script>
<script src="v4-logic.js"></script>
</body>
</html>
